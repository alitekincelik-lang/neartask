<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>İmza kopyala</title>
<style>body{margin:0;padding:22px 16px;font-family:-apple-system,Arial,sans-serif;background:#fff;color:#1f2937}button{display:block;width:100%;padding:20px;font-size:22px;font-weight:bold;color:#fff;background:#EE003A;border:0;border-radius:14px;margin:0 0 14px}#ok{display:none;font-size:19px;font-weight:bold;color:#0a7a2f;margin:0 0 18px;line-height:1.4}#box{border:1px dashed #cbd5e1;padding:14px;overflow:auto;-webkit-user-select:all;user-select:all}</style></head><body>
<button id="b">İMZAYI KOPYALA</button>
<div id="ok">Kopyalandı ✓<br>Şimdi Ayarlar → Uygulamalar → Mail → İmza kutusuna yapıştırın.</div>
<div id="box"><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#1f2937"><tr><td width="170" style="width:170px;vertical-align:top;padding-right:18px;border-right:3px solid #EE003A"><img src="https://neartask.co.uk/brand/sera-logo.png" width="170" alt="Sera Endüstriyel Reklam" style="display:block;border:0"></td><td style="vertical-align:top;padding-left:18px"><img src="https://neartask.co.uk/brand/atc-name.png" width="226" height="44" alt="Ali Tekin Çelik" style="display:block;border:0"><div style="font-size:14px;color:#EE003A;font-weight:bold;padding-top:4px;white-space:nowrap">Yönetim Kurulu Başkanı</div></td></tr><tr><td width="170" style="width:170px;vertical-align:middle;text-align:center;padding:10px 18px 0 0;border-right:3px solid #EE003A"><a href="https://www.instagram.com/serareklam" style="text-decoration:none"><img src="https://neartask.co.uk/brand/soc-ig.png" width="28" height="28" alt="Instagram" style="border:0;display:inline-block"></a>&nbsp;<a href="https://www.facebook.com/SeraEndustriyelReklam" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-fb.png" width="28" height="28" alt="Facebook" style="border:0;display:inline-block"></a>&nbsp;<a href="https://twitter.com/SeraEndustriyel" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-x.png" width="28" height="28" alt="X" style="border:0;display:inline-block"></a>&nbsp;<a href="https://tr.linkedin.com/company/sera-grup" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-li.png" width="28" height="28" alt="LinkedIn" style="border:0;display:inline-block"></a></td><td style="vertical-align:middle;padding:10px 0 0 18px;font-size:15px;line-height:1.5;white-space:nowrap"><a href="mailto:alitekin@serareklam.com.tr" style="color:#1f2937;text-decoration:none">alitekin@serareklam.com.tr</a><br><a href="https://www.serareklam.com.tr" style="color:#1f2937;text-decoration:none">www.serareklam.com.tr</a></td></tr></table></div>
<script>
document.getElementById('b').addEventListener('click',function(){
  var box=document.getElementById('box'),ok=false;
  try{var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy');}catch(e){}
  function done(){document.getElementById('ok').style.display='block';}
  if(ok){done();return;}
  try{var h=box.innerHTML;navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([box.innerText],{type:'text/plain'})})]).then(done);}catch(e){}
});
</script></body></html>
