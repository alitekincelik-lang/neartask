<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>İmza kopyala</title>
<style>body{margin:0;padding:22px 16px;font-family:-apple-system,Arial,sans-serif;background:#fff;color:#1f2937}button{display:block;width:100%;padding:20px;font-size:22px;font-weight:bold;color:#fff;background:#EE003A;border:0;border-radius:14px;margin:0 0 14px}#ok{display:none;font-size:19px;font-weight:bold;color:#0a7a2f;margin:0 0 18px;line-height:1.4}#box{border:1px dashed #cbd5e1;padding:14px;overflow:auto;-webkit-user-select:all;user-select:all}</style></head><body>
<button id="b">İMZAYI KOPYALA</button>
<div id="ok">Kopyalandı ✓<br>Şimdi imza kutusuna yapıştırın. Başka bir şey yapmanıza gerek yok.</div>
<div id="box"><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#1f2937"><tr><td width="210" style="width:210px;vertical-align:middle;text-align:center;padding-right:22px;border-right:3px solid #EE003A"><img src="https://neartask.co.uk/brand/auc-logo.png" width="94" height="118" alt="" style="display:block;border:0;margin:0 auto"><img src="https://neartask.co.uk/brand/auc-name.png" width="210" height="30" alt="Ahmet Ulaş Çelik" style="display:block;border:0;margin-top:8px"></td><td style="vertical-align:middle;padding-left:22px;white-space:nowrap"><img src="https://neartask.co.uk/brand/sera-logo.png" width="210" height="57" alt="Sera Endüstriyel Reklam" style="display:block;border:0"><a href="mailto:ahmetulas@serareklam.com.tr" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-auc-mail.png" width="218" height="19" alt="ahmetulas@serareklam.com.tr" style="display:block;border:0;margin-top:12px"></a><a href="https://www.serareklam.com.tr" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-auc-web.png" width="168" height="19" alt="www.serareklam.com.tr" style="display:block;border:0;margin-top:6px"></a><a href="tel:+903128475060" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-auc-tel.png" width="148" height="20" alt="+90 312 847 50 60" style="display:block;border:0;margin-top:6px"></a><div style="margin-top:10px"><a href="https://www.instagram.com/serareklam" style="text-decoration:none"><img src="https://neartask.co.uk/brand/soc-ig.png" width="26" height="26" alt="Instagram" style="border:0;display:inline-block"></a>&nbsp;<a href="https://www.facebook.com/SeraEndustriyelReklam" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-fb.png" width="26" height="26" alt="Facebook" style="border:0;display:inline-block"></a>&nbsp;<a href="https://twitter.com/SeraEndustriyel" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-x.png" width="26" height="26" alt="X" style="border:0;display:inline-block"></a>&nbsp;<a href="https://tr.linkedin.com/company/sera-grup" style="text-decoration:none"><img src="https://neartask.co.uk/brand/sera-li.png" width="26" height="26" alt="LinkedIn" style="border:0;display:inline-block"></a></div></td></tr></table></div>
<script>
document.getElementById('b').addEventListener('click',function(){
  var box=document.getElementById('box'),ok=false;
  try{var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy');}catch(e){}
  function done(){document.getElementById('ok').style.display='block';}
  if(ok){done();return;}
  try{var h=box.innerHTML;navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([box.innerText],{type:'text/plain'})})]).then(done);}catch(e){}
});
</script></body></html>
