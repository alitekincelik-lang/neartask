<style>:root{--ink:#14212b;--mute:#5b6875;--pri:#0E7C7B;--bg:#F4F6F8;--card:#fff;--line:#e3e8ee;--tint:#e3f2f1}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef2;--mute:#9fb0bd;--bg:#0f1719;--card:#172326;--line:#263437;--tint:#163234}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 56px}a{color:var(--pri);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;margin-bottom:20px;color:var(--ink);text-decoration:none}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px}h2{font-size:1.05rem;margin:24px 0 6px}.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:600}
.btn{display:block;text-align:center;background:var(--pri);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;margin-top:18px}
.pill{display:inline-block;background:var(--tint);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
ul.list{list-style:none;padding:0;margin:0}ul.list li{border-bottom:1px solid var(--line);padding:12px 0}ul.list a{text-decoration:none}
footer{margin-top:32px}</style>
</head>
<body>
<main>
<a class="brand" href="/"><img src="/icon.svg" width="32" height="32" alt=""> NearTask</a>

</main>
</body>
</html>
