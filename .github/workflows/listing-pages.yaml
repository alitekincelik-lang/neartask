# Every hour: makes one Google-friendly page per open NearTask listing (jobs/ and help/),
# updates sitemap.xml and publishes them. Uses only the public key; no secrets needed.
name: Listing pages
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: listing-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write the generator
        run: |
          mkdir -p /tmp/nt
          cat > /tmp/nt/listing-pages.mjs <<'NEARTASK_EOF'
          // Builds one plain, crawlable HTML page per open listing (jobs/… and help/…), a list page for each,
          // and the sitemap. Runs every hour in GitHub Actions (.github/workflows/listing-pages.yaml) from the
          // site root. Uses only the public (anon) key and only data anyone can already see in the app:
          // never the exact address, messages or private profile fields.
          //
          //   node listing-pages.mjs                 fetch from Supabase and write into the current folder
          //   node listing-pages.mjs --from x.json   use saved rows instead (for testing)
          import { mkdirSync, readdirSync, rmSync, writeFileSync, readFileSync, existsSync } from "node:fs";
          import { join } from "node:path";

          const SITE = "https://neartask.co.uk";
          const SUPABASE_URL = "https://qayxsfanlheldqepegob.supabase.co";
          // Public anon key (the same one the app ships with). Row level security decides what it can read.
          const ANON_KEY = process.env.NT_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFheXhzZmFubGhlbGRxZXBlZ29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODE4NDgsImV4cCI6MjEwODQ1Nzg0OH0.G7ewYasDxILFL9Lxi11Zph8ps7HTuW8GcRD_0b8Fjmc";
          const OUT = process.cwd();
          const CATS = { hospitality: "Hospitality", retail: "Shops & retail", warehouse: "Warehouse & driving", cleaning: "Cleaning", repairs: "Handyman & repairs", painting: "Painting & decorating", assembly: "Furniture assembly", garden: "Garden", moving: "Moving & delivery", care: "Care & errands", family: "Childcare & pets", lessons: "Lessons & tutoring", beauty: "Beauty & wellbeing", events: "Events & parties", tech: "Tech & admin", auto: "Car & vehicle", other: "Other" };
          const STATIC_PAGES = [["/", "1.0"], ["/jobs/", "0.8"], ["/help/", "0.6"], ["/employers.html", "0.5"], ["/privacy.html", "0.3"], ["/terms.html", "0.3"], ["/delete-account.html", "0.2"]];

          // ---------- data ----------
          async function load() {
            const i = process.argv.indexOf("--from");
            if (i > 0) return JSON.parse(readFileSync(process.argv[i + 1], "utf8"));
            const today = londonDate(Date.now());
            const select = "id,kind,title,category,area,date,start_time,end_time,pay,description,requirements,positions,status,created_at,details,photo_url,booked_package,owner:profiles!listings_owner_id_fkey(name:public_name,verified,account_type)";
            const q = new URLSearchParams({ select, status: "eq.open", booked_package: "is.null", date: "gte." + today, order: "date.asc,start_time.asc", limit: "1000" });
            const r = await fetch(`${SUPABASE_URL}/rest/v1/listings?${q}`, { headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY } });
            if (!r.ok) throw new Error("Supabase " + r.status + " " + (await r.text()));
            return r.json();
          }

          // ---------- time (UK) ----------
          function londonOffsetMin(ts) {
            const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
              .formatToParts(new Date(ts)).map((x) => [x.type, x.value]));
            return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute) - ts) / 6e4);
          }
          function londonDate(ts) { return new Date(ts + londonOffsetMin(ts) * 6e4).toISOString().slice(0, 10); }
          function at(date, time) { // local UK date + "HH:MM" -> ms
            const [y, m, d] = date.split("-").map(Number), [h, mi] = time.split(":").map(Number);
            const t = Date.UTC(y, m - 1, d, h, mi);
            return t - londonOffsetMin(t) * 6e4;
          }
          function endAt(l) { // same rule as job_end_at() in the database
            let t = at(l.date, l.end_time ? l.end_time.slice(0, 5) : "23:59");
            if (l.end_time && l.start_time && l.end_time.slice(0, 5) <= l.start_time.slice(0, 5)) t += 864e5;
            return t;
          }
          function iso(ts) { // 2026-11-07T17:00:00+00:00 in UK time
            const off = londonOffsetMin(ts), local = new Date(ts + off * 6e4).toISOString().slice(0, 19);
            const s = off >= 0 ? "+" : "-", a = Math.abs(off);
            return local + s + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
          }
          const dayText = (date) => new Date(date + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
          const timeText = (l) => (l.start_time ? l.start_time.slice(0, 5) + (l.end_time ? "–" + l.end_time.slice(0, 5) : "") : "Flexible time");

          // ---------- text ----------
          const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
          const para = (s) => esc(s).split(/\n{2,}/).map((p) => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
          function slugify(s) {
            return String(s).toLowerCase().replace(/ı/g, "i").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
              .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60).replace(/-+$/, "") || "listing";
          }
          function money(p) { // "12" -> "£12.00" (as in the app)
            const s = (p || "").trim();
            return /^\d+(\.\d{1,2})?$/.test(s) ? "£" + Number(s).toFixed(2) : s;
          }
          function hourly(p) { const m = (p || "").replace(/,/g, "").match(/£?\s*(\d+(?:\.\d{1,2})?)\s*(?:\/|per\s*)\s*h(?:ou)?r/i); return m ? Number(m[1]) : null; }
          function place(area) {
            const m = (area || "").toUpperCase().match(/\b([A-Z]{1,2}\d{1,2}[A-Z]?)(?:\s*\d[A-Z]{2})?\b/);
            const locality = (area || "").replace(/\b[A-Z]{1,2}\d{1,2}[A-Z]?(\s*\d[A-Z]{2})?\b/i, "").replace(/[,\s]+$/, "").trim();
            const pc = m ? m[1] : "";
            const town = pc === "BS31" ? "Keynsham" : /^BA\d/.test(pc) ? "Bath" : /^BS\d/.test(pc) ? "Bristol" : "";
            return { locality: locality || town || pc || "United Kingdom", postcode: pc };
          }
          const folder = (l) => (l.kind === "job" ? "jobs" : "help");
          const pathOf = (l) => `/${folder(l)}/${slugify(l.title + " " + place(l.area).locality + " " + l.date)}-${l.id.slice(0, 8)}.html`;
          const ownerName = (l) => (l.owner?.name || "").trim() || "A NearTask member";

          // ---------- HTML ----------
          const CSS = `:root{--ink:#14212b;--mute:#5b6875;--pri:#0E7C7B;--bg:#F4F6F8;--card:#fff;--line:#e3e8ee;--tint:#e3f2f1}
          @media (prefers-color-scheme:dark){:root{--ink:#e8eef2;--mute:#9fb0bd;--bg:#0f1719;--card:#172326;--line:#263437;--tint:#163234}}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          main{max-width:640px;margin:0 auto;padding:24px 16px 56px}a{color:var(--pri);font-weight:600}
          .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;margin-bottom:20px;color:var(--ink);text-decoration:none}
          h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px}h2{font-size:1.05rem;margin:24px 0 6px}.mute{color:var(--mute);font-size:.92rem}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
          .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:600}
          .btn{display:block;text-align:center;background:var(--pri);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;margin-top:18px}
          .pill{display:inline-block;background:var(--tint);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
          ul.list{list-style:none;padding:0;margin:0}ul.list li{border-bottom:1px solid var(--line);padding:12px 0}ul.list a{text-decoration:none}
          footer{margin-top:32px}`;

          function shell({ title, description, path, body, jsonld, robots = "index,follow" }) {
            return `<!doctype html>
          <html lang="en-GB">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>${esc(title)}</title>
          <meta name="description" content="${esc(description)}">
          <meta name="robots" content="${robots}">
          <link rel="canonical" href="${SITE}${path}">
          <link rel="icon" href="/icon.svg" type="image/svg+xml">
          <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="NearTask">
          <meta property="og:title" content="${esc(title)}">
          <meta property="og:description" content="${esc(description)}">
          <meta property="og:url" content="${SITE}${path}">
          <meta property="og:image" content="${SITE}/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          ${jsonld ? `<script type="application/ld+json">${JSON.stringify(jsonld).replace(/</g, "\\u003c")}</script>\n` : ""}<style>${CSS}</style>
          </head>
          <body>
          <main>
          <a class="brand" href="/"><img src="/icon.svg" width="32" height="32" alt=""> NearTask</a>
          ${body}
          <footer class="mute">NearTask is free to use: free to post, no commission. Run by Artwin Ltd (company no. 13371113). <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></footer>
          </main>
          </body>
          </html>
          `;
          }

          function listingPage(l) {
            const job = l.kind === "job", p = place(l.area), who = ownerName(l), path = pathOf(l);
            const when = dayText(l.date) + ", " + timeText(l);
            const title = `${l.title} – ${p.locality}${job ? "" : " (help wanted)"} | NearTask`;
            const description = `${job ? "Shift" : "Help wanted"} in ${l.area} on ${when}. ${job ? "Pay" : "Budget"}: ${money(l.pay)}. Posted by ${who}. Apply free on NearTask.`.slice(0, 300);
            const appUrl = `${SITE}/#/l/${l.id}`;
            const role = l.details?.role;
            const extra = Object.entries(l.details || {}).filter(([k, v]) => v && k !== "role");
            let jsonld = null;
            if (job) {
              const rate = hourly(l.pay);
              const descHtml = [para(l.description), l.requirements ? "<p><b>Requirements:</b> " + esc(l.requirements) + "</p>" : "", `<p><b>When:</b> ${esc(when)}</p><p><b>Pay:</b> ${esc(money(l.pay))}</p>`].join("");
              jsonld = {
                "@context": "https://schema.org", "@type": "JobPosting", title: l.title, description: descHtml,
                identifier: { "@type": "PropertyValue", name: "NearTask", value: l.id },
                datePosted: iso(Date.parse(l.created_at)), validThrough: iso(endAt(l)), employmentType: "TEMPORARY",
                hiringOrganization: { "@type": "Organization", name: who },
                jobLocation: { "@type": "Place", address: { "@type": "PostalAddress", addressLocality: p.locality, ...(p.postcode ? { postalCode: p.postcode } : {}), addressCountry: "GB" } },
                ...(l.positions > 1 ? { totalJobOpenings: l.positions } : {}),
                ...(rate ? { baseSalary: { "@type": "MonetaryAmount", currency: "GBP", value: { "@type": "QuantitativeValue", value: rate, unitText: "HOUR" } } } : {}),
                ...(l.photo_url ? { image: l.photo_url } : {}),
              };
            }
            const body = `<span class="pill">${esc(CATS[l.category] || "Other")}${role ? " · " + esc(role) : ""}</span>
          <h1>${esc(l.title)}</h1>
          <p class="mute">${esc(l.area)} · posted by ${esc(who)}${l.owner?.verified ? " ✓ verified" : ""}</p>
          <div class="card"><dl class="facts">
          <dt>When</dt><dd>${esc(when)}</dd>
          <dt>${job ? "Pay" : "Budget"}</dt><dd>${esc(money(l.pay))}</dd>
          <dt>Where</dt><dd>${esc(l.area)} <span class="mute">(exact address shared once you are accepted)</span></dd>
          ${l.positions > 1 ? `<dt>Places</dt><dd>${l.positions}</dd>\n` : ""}${extra.map(([k, v]) => `<dt>${esc(k[0].toUpperCase() + k.slice(1).replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("\n")}
          </dl></div>
          ${l.description ? `<h2>About ${job ? "the shift" : "the job"}</h2>${para(l.description)}` : ""}
          ${l.requirements ? `<h2>Requirements</h2>${para(l.requirements)}` : ""}
          <a class="btn" href="${appUrl}">${job ? "Apply on NearTask" : "Send an offer on NearTask"}</a>
          <p class="mute">Free to apply. You chat with ${esc(who)} in the app; pay is agreed directly between you.</p>
          <p><a href="/${folder(l)}/">More ${job ? "shifts and jobs" : "requests for help"} on NearTask</a></p>`;
            return { path, html: shell({ title, description, path, body, jsonld }), lastmod: (l.created_at || "").slice(0, 10) };
          }

          function indexPage(kind, rows) {
            const job = kind === "jobs", path = `/${kind}/`;
            const title = job ? "Local shifts and jobs across the UK | NearTask" : "Local help wanted across the UK | NearTask";
            const description = job ? "Current shifts and local jobs across the UK. Free to apply, no commission." : "People across the UK looking for help with cleaning, gardens, moving and more. Free to offer, no commission.";
            const items = rows.map((l) => `<li><a href="${pathOf(l)}"><b>${esc(l.title)}</b></a><br><span class="mute">${esc(dayText(l.date))} · ${esc(timeText(l))} · ${esc(l.area)} · ${esc(money(l.pay))}</span></li>`).join("\n");
            const body = `<h1>${job ? "Shifts and jobs near you" : "Help wanted near you"}</h1>
          <p class="mute">${rows.length} open ${rows.length === 1 ? "listing" : "listings"} · updated every hour</p>
          ${rows.length ? `<ul class="list">\n${items}\n</ul>` : `<p>Nothing open right now. New ${job ? "shifts" : "requests"} are added all the time.</p>`}
          <a class="btn" href="${SITE}/#/explore">Open NearTask</a>
          <p><a href="/${job ? "help" : "jobs"}/">${job ? "Help wanted" : "Shifts and jobs"}</a> · <a href="${SITE}/#/post">Post for free</a></p>`;
            return shell({ title, description, path, body, robots: rows.length ? "index,follow" : "noindex,follow" });
          }

          // ---------- write ----------
          const rows = (await load()).filter((l) => l.status === "open" && !l.booked_package && endAt(l) > Date.now());
          const pages = rows.map(listingPage);
          for (const dir of ["jobs", "help"]) {
            const d = join(OUT, dir);
            if (existsSync(d)) for (const f of readdirSync(d)) if (f.endsWith(".html")) rmSync(join(d, f));
            mkdirSync(d, { recursive: true });
            writeFileSync(join(d, "index.html"), indexPage(dir, rows.filter((l) => folder(l) === dir)));
          }
          for (const p of pages) writeFileSync(join(OUT, p.path.slice(1)), p.html);
          const today = londonDate(Date.now());
          const urls = [...STATIC_PAGES.map(([u, pr]) => `  <url><loc>${SITE}${u}</loc><lastmod>${today}</lastmod><priority>${pr}</priority></url>`),
            ...pages.map((p) => `  <url><loc>${SITE}${p.path}</loc><lastmod>${p.lastmod}</lastmod><priority>0.7</priority></url>`)];
          writeFileSync(join(OUT, "sitemap.xml"), `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.join("\n")}\n</urlset>\n`);
          console.log(`${pages.length} listing pages (${pages.filter((p) => p.path.startsWith("/jobs/")).length} jobs, ${pages.filter((p) => p.path.startsWith("/help/")).length} help)`);

          NEARTASK_EOF
      - name: Build pages
        run: node /tmp/nt/listing-pages.mjs
      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "NearTask bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs help sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update listing pages"
          git push
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
