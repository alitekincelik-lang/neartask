<script>
/* Phone opened at a desktop-width page (Chrome "Desktop site" ignores the viewport tag and lays out at ~980 px).
   Scale the page back to the phone's own width so NearTask fills the screen. Normal phones, tablets and computers are untouched. */
(function () {
  function fit() {
    var d = document.documentElement, sw = screen.width, w = window.innerWidth;
    var touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    var z = touch && sw > 0 && sw < 600 && w > sw * 1.3 ? w / sw : 1;
    d.style.zoom = z === 1 ? "" : String(z);
    d.classList.toggle("fitphone", z !== 1);
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", fit);
})();
</script>
